stages:
  - validate
  - build
  - test

variables:
  DJANGO_SETTINGS_MODULE: "joybox.settings"
  VENV_PATH: ".venv"

default:
  before_script:
    - python -m venv $VENV_PATH
    - source $VENV_PATH/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt

validate-django-settings:
  stage: validate
  script:
    - echo "Проверка настроек Django"
    - python3 manage.py check
    - echo "Настройки Django валидны"

validate-migrations:
  stage: validate
  script:
    - echo "Проверка миграций Django"
    - python3 manage.py makemigrations --check --dry-run
    - echo "Миграции валидны"

validate-models:
  stage: validate
  script:
    - echo "Проверка моделей Django"
    - python manage.py validate_templates 2>/dev/null || true
    - echo "Модели Django валидны"

build-check:
  stage: build
  script:
    - echo "Проверка сборки проекта"
    - python manage.py check
    - python manage.py makemigrations --check --dry-run
    - python manage.py collectstatic --noinput --dry-run
    - echo "Проект успешно собран"

test-staticfiles:
  stage: test
  before_script:
  script:
    - echo "Проверка static файлов"
    - python3 manage.py collectstatic --noinput --dry-run
    - echo "Static файлы валидны"