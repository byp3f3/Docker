stages:
  - build
  - linter
  - check

variables:
  DJANGO_SETTINGS_MODULE: "joybox.settings"
  VENV_PATH: ".venv"

default:
  before_script:
    - python3 -m venv $VENV_PATH
    - source $VENV_PATH/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt

# Проверка сборки проекта
build-check:
  stage: build
  script:
    - echo "Проверка сборки проекта"
    - python manage.py check
    - python manage.py makemigrations --check --dry-run
    - python manage.py collectstatic --noinput --dry-run
    - echo "Проект успешно собран"

#Проверка синтаксических ошибок линтером
linter-check:
  stage: linter
  rules: 
  - allow_failure: true
  script:
  - echo "Проверка синтаксических ошибок с помощью flake8"
  - pip install flake8
  - python -m flake8 joybox
  - echo "Проверка синтаксических ошибок завершена"

# 2 дополнительные задачи
safety-check:
  stage: check
  rules: 
  - allow_failure: true
  script:
    - echo "Проверка безопасности"
    - pip install bandit
    - bandit -r .
    - echo "Проверка безопасности пройдена успешно"

dependencies-check:
  stage: check
  script:
    - echo "Проверка зависимостей на актуальность"
    - pip list --outdated
    - pip check
    - echo "Проверка зависимостей на актуальность пройдена успешно"