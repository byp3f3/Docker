stages:
  - test

variables:
  DJANGO_SETTINGS_MODULE: "joybox.settings"
  VENV_PATH: ".venv"
  POSTGRES_DB: joybox
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: 124
  POSTGRES_HOST_AUTH_METHOD: trust
  DB_ENGINE: django.db.backends.postgresql
  DB_NAME: joybox
  DB_USER: postgres
  DB_PASSWORD: 124
  DB_HOST: postgres   
  DB_PORT: 5432

default:
  before_script:
    - python3 -m venv $VENV_PATH
    - source $VENV_PATH/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt

test-check:
  stage: test
  services:
    - postgres:15
  variables:
    POSTGRES_DB: joybox
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: 124
    POSTGRES_HOST_AUTH_METHOD: trust
  script:
    - echo "=== Запуск тестов ==="
    
    # Диагностика сети (без установки дополнительных пакетов)
    - echo "=== Содержимое /etc/hosts ==="
    - cat /etc/hosts
    
    - echo "=== Проверка доступности хоста postgres ==="
    - getent hosts postgres || echo "Хост postgres не найден в /etc/hosts"
    
    # Проверка через Python (у вас уже есть Python с Django)
    - echo "=== Проверка через Python ==="
    - python -c "import socket; print('IP адрес postgres:', socket.gethostbyname('postgres'))" || echo "Не удалось получить IP"
    
    # Проверка подключения к PostgreSQL через Python
    - echo "=== Проверка подключения к PostgreSQL ==="
    - python -c "
      import psycopg2
      import time
      import sys
      for i in range(30):
          try:
              conn = psycopg2.connect(
                  host='postgres',
                  user='postgres',
                  password='124',
                  dbname='postgres',
                  connect_timeout=2
              )
              conn.close()
              print('PostgreSQL доступен!')
              sys.exit(0)
          except Exception as e:
              print(f'Попытка {i+1}: PostgreSQL не готов - {e}')
              time.sleep(2)
      print('Не удалось подключиться к PostgreSQL')
      sys.exit(1)
      "
    
    - echo "=== Запуск тестов Django ==="
    - python manage.py test core --verbosity=2
    
    - echo "=== Все тесты пройдены успешно ==="