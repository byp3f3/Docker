<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль пользователя {{ user.username }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .profile-card {
            max-width: 800px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-left: 5px solid;
        }
        .Admin { border-left-color: #dc3545; }
        .Manager { border-left-color: #fd7e14; }
        .Customer { border-left-color: #20c997; }
        .role-badge {
            font-size: 1rem;
            padding: 0.5em 0.8em;
        }
        .profile-header {
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        .detail-label {
            font-weight: 500;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card profile-card {{ user.role }} mb-4">
                    <div class="card-header profile-header bg-white">
                        <div class="d-flex justify-content-between align-items-center">
                            <h1 class="h3 mb-0">{{ user.username }}</h1>
                            <span class="badge role-badge 
                                {% if user.role == 'Admin' %}bg-danger
                                {% elif user.role == 'Manager' %}bg-warning text-dark
                                {% else %}bg-success{% endif %}">
                                {{ user.get_role_display }}
                            </span>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <p class="mb-3">
                                    <span class="detail-label">Email:</span><br>
                                    <a href="mailto:{{ user.email }}">{{ user.email }}</a>
                                </p>
                                
                                <p class="mb-3">
                                    <span class="detail-label">Дата регистрации:</span><br>
                                    {{ user.created_at|date:"d.m.Y H:i" }}
                                </p>
                            </div>
                            <div class="col-md-6">
                                <!-- Здесь можно добавить аватар пользователя, если добавите поле photo в модель -->
                                <div class="bg-light rounded-circle d-flex align-items-center justify-content-center" 
                                     style="width: 120px; height: 120px; margin: 0 auto; font-size: 3rem;">
                                    {{ user.username|first|upper }}
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer bg-white d-flex justify-content-between">
                        <a href="{% url 'user_list' %}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Вернуться к списку
                        </a>
                        <div>
                            <a href="{% url 'user_update' user.pk %}" class="btn btn-primary me-2">
                                <i class="bi bi-pencil"></i> Редактировать
                            </a>
                            <a href="{% url 'user_delete' user.pk %}" class="btn btn-danger">
                                <i class="bi bi-trash"></i> Удалить
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Здесь можно добавить дополнительные блоки, например, статистику или активность пользователя -->
            </div>
        </div>
    </div>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
